name: CI

on:
  push:
  pull_request:
  workflow_dispatch:   # manual run; takes no inputs (the firmware commit is pinned below)

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests (CMake + CTest + Unity, ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Configure
        run: cmake -S test/host -B build/host -G Ninja -DRB_SANITIZE=ON
      - name: Build
        run: cmake --build build/host
      - name: Test
        run: ctest --test-dir build/host --output-on-failure

  repository-checks:
    name: Layering and third-party notices
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Self-test the checks
        run: python3 -I -m unittest discover -s tools/tests -v
      - name: Check layering (ADR-002)
        run: python3 -I tools/check_layering.py
      - name: Check third-party notices (ADR-013)
        run: python3 -I tools/check_notices.py

  esp-idf-build:
    name: ESP-IDF build (esp32)
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1   # D-12: pinned ESP-IDF release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build firmware (default profile)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build
          # The default build must keep the unconfirmed board profile (H3-11).
          grep -q '^CONFIG_RB_BOARD_UNCONFIRMED=y' sdkconfig
          idf.py size
      - name: Build firmware (FujiNet Atari v1.3/1.5 microSD profile, compile only)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-fujinet -D SDKCONFIG=build-fujinet/sdkconfig \
                 -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.board.fujinet-atari-v1x" build
          grep -q '^CONFIG_RB_BOARD_FUJINET_ATARI_V1X=y' build-fujinet/sdkconfig
          grep -q '^CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y' build-fujinet/sdkconfig
          grep -q '^CONFIG_PARTITION_TABLE_CUSTOM=y' build-fujinet/sdkconfig
          idf.py -B build-fujinet -D SDKCONFIG=build-fujinet/sdkconfig size

  # Downloadable diagnostic firmware for the FujiNet Atari FN32ROV-1.3/1.5 board (H3c).
  # Always built from the pinned firmware commit FW_COMMIT, checked out apart from
  # the packaging tools of this workflow's own commit. Pull Requests and manual
  # runs only. The RB_BOARD_UNCONFIRMED build is never published.
  firmware-package:
    name: Firmware package (FujiNet Atari FN32ROV-1.3/1.5)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1   # D-12: pinned ESP-IDF release
    env:
      FW_COMMIT: 1b1527d2dfd29a5f66471cbb2a14a3d49585dd8e
    steps:
      - name: Checkout packaging tools (this workflow's commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci
          persist-credentials: false
      - name: Checkout firmware source (pinned commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FW_COMMIT }}
          path: src
          fetch-depth: 0
          persist-credentials: false
      - name: Build firmware (RB_BOARD_FUJINET_ATARI_V1X)
        shell: bash
        run: |
          # The container runs as another user than the checkout owner: trust only these two trees.
          git config --global --add safe.directory "$GITHUB_WORKSPACE/ci"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/src"
          . "$IDF_PATH/export.sh"
          mkdir reports
          cd src
          idf.py -B build-fujinet -D SDKCONFIG=build-fujinet/sdkconfig \
                 -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.board.fujinet-atari-v1x" build
          idf.py -B build-fujinet -D SDKCONFIG=build-fujinet/sdkconfig size > ../reports/size.txt
          idf.py -B build-fujinet -D SDKCONFIG=build-fujinet/sdkconfig size-components > ../reports/size-components.txt
      - name: Verify and package
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          out="out/retrobridge-fw-fujinet-atari-v1x-${FW_COMMIT:0:7}"
          python3 -I ci/tools/ci/firmware_package.py package --src src --build src/build-fujinet \
                  --reports reports --out "$out" --baseline "$FW_COMMIT"
          { echo '```'; cat "$out/reports/checks.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retrobridge-fw-fujinet-atari-v1x-1b1527d
          path: out/
          if-no-files-found: error
          retention-days: 90
      - name: Record artifact digest
        shell: bash
        env:
          DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          echo "Artifact zip SHA-256: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
