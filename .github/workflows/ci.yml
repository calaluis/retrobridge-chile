name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests (CMake + CTest + Unity, ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Configure
        run: cmake -S test/host -B build/host -G Ninja -DRB_SANITIZE=ON
      - name: Build
        run: cmake --build build/host
      - name: Test
        run: ctest --test-dir build/host --output-on-failure

  repository-checks:
    name: Layering and third-party notices
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Self-test the checks
        run: python3 -I -m unittest discover -s tools/tests -v
      - name: Check layering (ADR-002)
        run: python3 -I tools/check_layering.py
      - name: Check third-party notices (ADR-013)
        run: python3 -I tools/check_notices.py

  esp-idf-build:
    name: ESP-IDF build (esp32)
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1   # D-12: pinned ESP-IDF release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build firmware (default profile)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build
          # The default build must keep the unconfirmed board profile (H3-11).
          grep -q '^CONFIG_RB_BOARD_UNCONFIRMED=y' sdkconfig
          idf.py size
      - name: Build firmware (FujiNet Atari v1.3/1.5 microSD profile, compile only)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-fujinet -D SDKCONFIG=build-fujinet/sdkconfig \
                 -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.board.fujinet-atari-v1x" build
          grep -q '^CONFIG_RB_BOARD_FUJINET_ATARI_V1X=y' build-fujinet/sdkconfig
          grep -q '^CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y' build-fujinet/sdkconfig
          grep -q '^CONFIG_PARTITION_TABLE_CUSTOM=y' build-fujinet/sdkconfig
          # The normal FujiNet build never serves SIO (H4): the menu-sio test package is off.
          # (`if`, not `! grep`: bash -e does not stop on a negated command.)
          if grep -q '^CONFIG_RB_MENU_SIO=y' build-fujinet/sdkconfig; then echo "menu-sio in the normal build"; exit 1; fi
          idf.py -B build-fujinet -D SDKCONFIG=build-fujinet/sdkconfig size
      - name: Build firmware (test package menu-sio, compile only; H4 not approved)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-menu-sio -D SDKCONFIG=build-menu-sio/sdkconfig \
                 -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.board.fujinet-atari-v1x;sdkconfig.menu-sio" build
          grep -q '^CONFIG_RB_MENU_SIO=y' build-menu-sio/sdkconfig
          if grep -q '^CONFIG_RB_BENCH_C8=y' build-menu-sio/sdkconfig; then echo "bench-c8 in menu-sio"; exit 1; fi
          idf.py -B build-menu-sio -D SDKCONFIG=build-menu-sio/sdkconfig size

  # Read-only cassette firmware (cassette-cas, variant "cassette-lectura") for the FujiNet Atari
  # FN32ROV-1.3/1.5: `cas mount` and `cas status` over USB, with H4 and M3a unsigned, so DATA IN and
  # MOTOR are never configured. Always built from the pinned firmware commit FW_COMMIT, checked out
  # apart from the packaging tools of this workflow's own commit. Pull Requests and manual runs only.
  firmware-package-cassette-lectura:
    name: Firmware package cassette-lectura (FujiNet Atari FN32ROV-1.3/1.5)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1   # D-12: pinned ESP-IDF release
    env:
      FW_COMMIT: f40510642090843de6b7f83a1bb07c5521df278a
    steps:
      - name: Checkout packaging tools (this workflow's commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci
          persist-credentials: false
      - name: Checkout firmware source (pinned commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FW_COMMIT }}
          path: src
          fetch-depth: 0
          persist-credentials: false
      - name: Build firmware (RB_BOARD_FUJINET_ATARI_V1X)
        shell: bash
        run: |
          # The container runs as another user than the checkout owner: trust only these two trees.
          git config --global --add safe.directory "$GITHUB_WORKSPACE/ci"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/src"
          . "$IDF_PATH/export.sh"
          mkdir reports
          cd src
          idf.py -B build-fujinet -D SDKCONFIG=build-fujinet/sdkconfig \
                 -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.board.fujinet-atari-v1x" build
          idf.py -B build-fujinet -D SDKCONFIG=build-fujinet/sdkconfig size > ../reports/size.txt
          idf.py -B build-fujinet -D SDKCONFIG=build-fujinet/sdkconfig size-components > ../reports/size-components.txt
      - name: Verify and package
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          out="out/retrobridge-fw-cassette-lectura-fujinet-atari-v1x-${FW_COMMIT:0:7}"
          python3 -I ci/tools/ci/firmware_package.py package --src src --build src/build-fujinet \
                  --reports reports --out "$out" --baseline "$FW_COMMIT" --variant cassette-lectura
          python3 -I ci/tools/ci/firmware_package.py verify "$out"
          { echo '```'; cat "$out/reports/checks.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retrobridge-fw-cassette-lectura-fujinet-atari-v1x-f405106
          path: out/
          if-no-files-found: error
          retention-days: 90
      - name: Record artifact digest
        shell: bash
        env:
          DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          echo "Artifact zip SHA-256: $DIGEST" >> "$GITHUB_STEP_SUMMARY"

  # Bench test C8 (H4-C, variant "bench-c8"): the read-only cassette plus, at boot, one run of DATA IN on the
  # FujiNet alone (USB only, the Atari disconnected), then the pin released. H4 and M3a stay unsigned. Built
  # from the commit under test (the PR head), tools and source alike. Pull Requests and manual runs only.
  firmware-package-bench-c8:
    name: Firmware package bench-c8 (FujiNet Atari FN32ROV-1.3/1.5, DATA IN bench test)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1   # D-12: pinned ESP-IDF release
    env:
      FW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout packaging tools (commit under test)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FW_COMMIT }}
          path: ci
          persist-credentials: false
      - name: Checkout firmware source (commit under test)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FW_COMMIT }}
          path: src
          fetch-depth: 0
          persist-credentials: false
      - name: Build firmware (RB_BOARD_FUJINET_ATARI_V1X + RB_BENCH_C8)
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/ci"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/src"
          . "$IDF_PATH/export.sh"
          mkdir reports
          cd src
          idf.py -B build-bench -D SDKCONFIG=build-bench/sdkconfig \
                 -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.board.fujinet-atari-v1x;sdkconfig.bench-c8" build
          grep -q '^CONFIG_RB_BENCH_C8=y' build-bench/sdkconfig
          idf.py -B build-bench -D SDKCONFIG=build-bench/sdkconfig size > ../reports/size.txt
          idf.py -B build-bench -D SDKCONFIG=build-bench/sdkconfig size-components > ../reports/size-components.txt
      - name: Verify and package
        id: package
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          name="retrobridge-fw-bench-c8-fujinet-atari-v1x-${FW_COMMIT:0:7}"
          out="out/$name"
          python3 -I ci/tools/ci/firmware_package.py package --src src --build src/build-bench \
                  --reports reports --out "$out" --baseline "$FW_COMMIT" --variant bench-c8
          python3 -I ci/tools/ci/firmware_package.py verify "$out"
          { echo '```'; cat "$out/reports/checks.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: out/
          if-no-files-found: error
          retention-days: 90
      - name: Record artifact digest
        shell: bash
        env:
          DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          echo "Artifact zip SHA-256: $DIGEST" >> "$GITHUB_STEP_SUMMARY"

  # Test package menu-sio (menu-sio-fisico E1, variant "menu-sio"): the menu served as D1 on the physical SIO
  # (UART2: TX DATA IN GPIO21, RX DATA OUT GPIO33, COMMAND GPIO39), H4 and M3a unsigned. Compiled and packaged
  # only; using it on the FujiNet and the Atari needs the owner's written risk acceptance. Built from the commit
  # under test (the PR head), tools and source alike. Pull Requests and manual runs only.
  firmware-package-menu-sio:
    name: Firmware package menu-sio (FujiNet Atari FN32ROV-1.3/1.5, menu on the physical SIO, test package)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1   # D-12: pinned ESP-IDF release
    env:
      FW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout packaging tools (commit under test)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FW_COMMIT }}
          path: ci
          persist-credentials: false
      - name: Checkout firmware source (commit under test)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FW_COMMIT }}
          path: src
          fetch-depth: 0
          persist-credentials: false
      - name: Build firmware (RB_BOARD_FUJINET_ATARI_V1X + RB_MENU_SIO)
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/ci"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/src"
          . "$IDF_PATH/export.sh"
          mkdir reports
          cd src
          idf.py -B build-menu-sio -D SDKCONFIG=build-menu-sio/sdkconfig \
                 -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.board.fujinet-atari-v1x;sdkconfig.menu-sio" build
          grep -q '^CONFIG_RB_MENU_SIO=y' build-menu-sio/sdkconfig
          idf.py -B build-menu-sio -D SDKCONFIG=build-menu-sio/sdkconfig size > ../reports/size.txt
          idf.py -B build-menu-sio -D SDKCONFIG=build-menu-sio/sdkconfig size-components > ../reports/size-components.txt
      - name: Verify and package
        id: package
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          name="retrobridge-fw-menu-sio-fujinet-atari-v1x-${FW_COMMIT:0:7}"
          out="out/$name"
          python3 -I ci/tools/ci/firmware_package.py package --src src --build src/build-menu-sio \
                  --reports reports --out "$out" --baseline "$FW_COMMIT" --variant menu-sio
          python3 -I ci/tools/ci/firmware_package.py verify "$out"
          { echo '```'; cat "$out/reports/checks.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: out/
          if-no-files-found: error
          retention-days: 90
      - name: Record artifact digest
        shell: bash
        env:
          DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          echo "Artifact zip SHA-256: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
