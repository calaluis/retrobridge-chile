name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests (CMake + CTest + Unity, ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - name: Configure
        run: cmake -S test/host -B build/host -G Ninja -DRB_SANITIZE=ON
      - name: Build
        run: cmake --build build/host
      - name: Test
        run: ctest --test-dir build/host --output-on-failure

  repository-checks:
    name: Layering and third-party notices
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Self-test the checks
        run: python3 -I -m unittest discover -s tools/tests -v
      - name: Check layering (ADR-002)
        run: python3 -I tools/check_layering.py
      - name: Check third-party notices (ADR-013)
        run: python3 -I tools/check_notices.py
      - name: Check the owner's FujiNet files (ADR-012 amendment 2)
        run: python3 -I tools/check_fujinet_fsk.py

  esp-idf-build:
    name: ESP-IDF build (esp32)
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1   # D-12: pinned ESP-IDF release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build firmware (default profile)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build
          # The default build must keep the unconfirmed board profile (H3-11).
          grep -q '^CONFIG_RB_BOARD_UNCONFIRMED=y' sdkconfig
          idf.py size
      - name: Build firmware (FujiNet Atari v1.3/1.5 microSD profile, compile only)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-fujinet -D SDKCONFIG=build-fujinet/sdkconfig \
                 -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.board.fujinet-atari-v1x" build
          grep -q '^CONFIG_RB_BOARD_FUJINET_ATARI_V1X=y' build-fujinet/sdkconfig
          grep -q '^CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y' build-fujinet/sdkconfig
          grep -q '^CONFIG_PARTITION_TABLE_CUSTOM=y' build-fujinet/sdkconfig
          # The normal FujiNet build never serves SIO (H4): the menu-sio test package is off.
          # (`if`, not `! grep`: bash -e does not stop on a negated command.)
          if grep -q '^CONFIG_RB_MENU_SIO=y' build-fujinet/sdkconfig; then echo "menu-sio in the normal build"; exit 1; fi
          idf.py -B build-fujinet -D SDKCONFIG=build-fujinet/sdkconfig size
      - name: Build firmware (test package menu-sio, compile only; H4 not approved)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-menu-sio -D SDKCONFIG=build-menu-sio/sdkconfig \
                 -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.board.fujinet-atari-v1x;sdkconfig.menu-sio" build
          grep -q '^CONFIG_RB_MENU_SIO=y' build-menu-sio/sdkconfig
          if grep -q '^CONFIG_RB_MENU_SIO_TAPE_OUTPUT=y' build-menu-sio/sdkconfig; then echo "tape output in menu-sio"; exit 1; fi
          if grep -q '^CONFIG_RB_BENCH_C8=y' build-menu-sio/sdkconfig; then echo "bench-c8 in menu-sio"; exit 1; fi
          idf.py -B build-menu-sio -D SDKCONFIG=build-menu-sio/sdkconfig size
      - name: Build firmware (experimental variant cas-fujinet, compile only; H4 not approved)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          # cassette-motor-fujinet: the owner's FujiNet FSK engine (rb_fujinet_fsk) plays the tape. No gate
          # changes: kTapeOutput stays false, H4 unsigned. Not packaged.
          idf.py -B build-cas-fujinet -D SDKCONFIG=build-cas-fujinet/sdkconfig \
                 -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.board.fujinet-atari-v1x;sdkconfig.menu-sio;sdkconfig.cas-fujinet" build
          grep -q '^CONFIG_RB_CAS_ENGINE_FUJINET=y' build-cas-fujinet/sdkconfig
          grep -q '^CONFIG_RB_MENU_SIO=y' build-cas-fujinet/sdkconfig
          # Only this variant links the engine; the normal and menu-sio builds never do. (nm into a file:
          # with pipefail, `nm | grep -q` can fail on SIGPIPE even when grep matched.)
          xtensa-esp32-elf-nm -C build-cas-fujinet/retrobridge.elf > nm-cas-fujinet.txt
          grep -q 'cassette_fsk_play_run' nm-cas-fujinet.txt
          for b in build build-fujinet build-menu-sio; do
            if grep -q '^CONFIG_RB_CAS_ENGINE_FUJINET=y' "$b/sdkconfig"; then echo "cas-fujinet in $b"; exit 1; fi
            xtensa-esp32-elf-nm -C "$b/retrobridge.elf" > "nm-$b.txt"
            if grep -q 'cassette_fsk_play_run' "nm-$b.txt"; then echo "engine linked in $b"; exit 1; fi
          done
          idf.py -B build-cas-fujinet -D SDKCONFIG=build-cas-fujinet/sdkconfig size
      - name: DataInHandover and TapeProgress atomics without locks on Xtensa (menu-cinta T9a.1, T9a.7)
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          # Negative control first: a 64-bit atomic load, built with the same command, must be caught.
          python3 -I tools/ci/check_atomic_calls.py probe --compdb build-menu-sio/compile_commands.json
          python3 -I tools/ci/check_atomic_calls.py check \
                  --obj build-menu-sio/esp-idf/rb_menu/CMakeFiles/__idf_rb_menu.dir/src/data_in_handover.cpp.obj
          # T9a.7 (requirement 2): every access of the cassette ports (DataInHandover, TapeProgress) is here.
          python3 -I tools/ci/check_atomic_calls.py check --expect progress \
                  --obj build-menu-sio/esp-idf/main/CMakeFiles/__idf_main.dir/cassette_ports.cpp.obj
          # fix-cinta-data-in-65xe (review PR #124, H1): the take diagnostics, read across tasks.
          python3 -I tools/ci/check_atomic_calls.py check --expect probe \
                  --obj build-menu-sio/esp-idf/rb_esp_cassette/CMakeFiles/__idf_rb_esp_cassette.dir/src/esp_data_in.cpp.obj
          python3 -I tools/ci/check_atomic_calls.py check --expect tick \
                  --obj build-menu-sio/esp-idf/rb_esp_cassette/CMakeFiles/__idf_rb_esp_cassette.dir/src/cassette_service.cpp.obj

  # The cassette firmware (variant "cassette", both gates) is not packaged: H4 stays unapproved, and before T9b only
  # menu-sio is installed (docs/mediciones/puertas-aceptacion-riesgo-2026-11-25.md). The read-only cassette-lectura and
  # bench-c8 packages, which needed both gates unsigned, are retired.

  # Bench C8a, phase F3 (docs/hardware/banco-c8a-aislado.md, variant "bench-c8a"): bench C8 with the F1 controls
  # (SIO_5V interlock on GPIO35, `c8a run` only), H4 unapproved and M3a approved. Built from the commit under test,
  # packaged and verified so the ESP-IDF image is checked (bench and c8a markers, cassette not started, no menu).
  # C-6: a Pull Request uploads nothing; the package stays on the runner and is discarded with it. F4 (the owner's
  # written decision, 2026-11-25): only a manual run (workflow_dispatch) on main uploads it, for 7 days, to be flashed
  # over USB with the SIO cable disconnected; a manual run on any other branch builds and verifies but uploads
  # nothing, so only merged code is distributed. Pull Requests and manual runs only.
  firmware-package-bench-c8a:
    name: Firmware package bench-c8a (FujiNet Atari FN32ROV-1.3/1.5, bench C8a, uploaded only by a manual run on main)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1   # D-12: pinned ESP-IDF release
    env:
      FW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout packaging tools (commit under test)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FW_COMMIT }}
          path: ci
          persist-credentials: false
      - name: Checkout firmware source (commit under test)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FW_COMMIT }}
          path: src
          fetch-depth: 0
          persist-credentials: false
      - name: Build firmware (RB_BOARD_FUJINET_ATARI_V1X + RB_BENCH_C8)
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/ci"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/src"
          . "$IDF_PATH/export.sh"
          mkdir reports
          cd src
          idf.py -B build-bench-c8a -D SDKCONFIG=build-bench-c8a/sdkconfig \
                 -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.board.fujinet-atari-v1x;sdkconfig.bench-c8" build
          grep -q '^CONFIG_RB_BENCH_C8=y' build-bench-c8a/sdkconfig
          if grep -q '^CONFIG_RB_MENU_SIO=y' build-bench-c8a/sdkconfig; then echo "menu-sio in the bench"; exit 1; fi
          idf.py -B build-bench-c8a -D SDKCONFIG=build-bench-c8a/sdkconfig size > ../reports/size.txt
          idf.py -B build-bench-c8a -D SDKCONFIG=build-bench-c8a/sdkconfig size-components > ../reports/size-components.txt
      - name: Verify and package
        id: package
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          name="retrobridge-BENCH-C8A-NO-SIO-fujinet-atari-v1x-${FW_COMMIT:0:7}"
          out="out/$name"
          python3 -I ci/tools/ci/firmware_package.py package --src src --build src/build-bench-c8a \
                  --reports reports --out "$out" --baseline "$FW_COMMIT" --variant bench-c8a
          python3 -I ci/tools/ci/firmware_package.py verify "$out"
          { echo '```'; cat "$out/reports/checks.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Upload artifact bench-c8a (manual run on main only, F4; USB only, SIO cable disconnected)
        id: upload
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: out/
          if-no-files-found: error
          retention-days: 7
      - name: Record artifact digest
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          echo "Artifact zip SHA-256: $DIGEST" >> "$GITHUB_STEP_SUMMARY"

  # Test package menu-sio (menu-sio-fisico E1, variant "menu-sio"): the menu served as D1 on the physical SIO
  # (UART2: TX DATA IN GPIO21, RX DATA OUT GPIO33, COMMAND GPIO39), with M3a approved by the owner's risk acceptance
  # of R1 (MOTOR read on GPIO36) and H4 unapproved, so the tape never leaves by the SIO. The only package to install
  # before T9b. Built from the commit under test (the PR head), tools and source alike. Pull Requests and manual
  # runs only.
  firmware-package-menu-sio:
    name: Firmware package menu-sio (FujiNet Atari FN32ROV-1.3/1.5, menu on the physical SIO, test package)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1   # D-12: pinned ESP-IDF release
    env:
      FW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout packaging tools (commit under test)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FW_COMMIT }}
          path: ci
          persist-credentials: false
      - name: Checkout firmware source (commit under test)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FW_COMMIT }}
          path: src
          fetch-depth: 0
          persist-credentials: false
      - name: Build firmware (RB_BOARD_FUJINET_ATARI_V1X + RB_MENU_SIO)
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/ci"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/src"
          . "$IDF_PATH/export.sh"
          mkdir reports
          cd src
          idf.py -B build-menu-sio -D SDKCONFIG=build-menu-sio/sdkconfig \
                 -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.board.fujinet-atari-v1x;sdkconfig.menu-sio" build
          grep -q '^CONFIG_RB_MENU_SIO=y' build-menu-sio/sdkconfig
          idf.py -B build-menu-sio -D SDKCONFIG=build-menu-sio/sdkconfig size > ../reports/size.txt
          idf.py -B build-menu-sio -D SDKCONFIG=build-menu-sio/sdkconfig size-components > ../reports/size-components.txt
      - name: Verify and package
        id: package
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          name="retrobridge-fw-menu-sio-fujinet-atari-v1x-${FW_COMMIT:0:7}"
          out="out/$name"
          python3 -I ci/tools/ci/firmware_package.py package --src src --build src/build-menu-sio \
                  --reports reports --out "$out" --baseline "$FW_COMMIT" --variant menu-sio
          python3 -I ci/tools/ci/firmware_package.py verify "$out"
          { echo '```'; cat "$out/reports/checks.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: out/
          if-no-files-found: error
          retention-days: 90
      - name: Record artifact digest
        shell: bash
        env:
          DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          echo "Artifact zip SHA-256: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
  # Package menu-sio-cinta (cas-salida-data-in, T9b, variant "menu-sio-cinta"): menu-sio plus the tape on DATA IN
  # (CONFIG_RB_MENU_SIO_TAPE_OUTPUT). Only for the owner's FujiNet FN32ROV-1.3-Q24 with the owner's 65XE: the owner
  # accepted R2, R6 and R7 for DATA IN without measurement (docs/mediciones/aceptacion-data-in-casete-2026-11-26.md).
  # H4 unapproved. A passing job authorizes no flashing. Pull Requests and manual runs only.
  firmware-package-menu-sio-cinta:
    name: Firmware package menu-sio-cinta (owner's FN32ROV-1.3-Q24 only, tape on DATA IN by risk acceptance)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1   # D-12: pinned ESP-IDF release
    env:
      FW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout packaging tools (commit under test)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FW_COMMIT }}
          path: ci
          persist-credentials: false
      - name: Checkout firmware source (commit under test)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.FW_COMMIT }}
          path: src
          fetch-depth: 0
          persist-credentials: false
      - name: Build firmware (RB_BOARD_FUJINET_ATARI_V1X + RB_MENU_SIO + RB_MENU_SIO_TAPE_OUTPUT)
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/ci"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/src"
          . "$IDF_PATH/export.sh"
          mkdir reports
          cd src
          idf.py -B build-menu-sio-cinta -D SDKCONFIG=build-menu-sio-cinta/sdkconfig \
                 -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.board.fujinet-atari-v1x;sdkconfig.menu-sio;sdkconfig.menu-sio-cinta" build
          grep -q '^CONFIG_RB_MENU_SIO=y' build-menu-sio-cinta/sdkconfig
          grep -q '^CONFIG_RB_MENU_SIO_TAPE_OUTPUT=y' build-menu-sio-cinta/sdkconfig
          idf.py -B build-menu-sio-cinta -D SDKCONFIG=build-menu-sio-cinta/sdkconfig size > ../reports/size.txt
          idf.py -B build-menu-sio-cinta -D SDKCONFIG=build-menu-sio-cinta/sdkconfig size-components > ../reports/size-components.txt
      - name: Verify and package
        id: package
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          name="retrobridge-fw-menu-sio-CINTA-solo-FN32ROV-1.3-Q24-del-responsable-${FW_COMMIT:0:7}"
          out="out/$name"
          python3 -I ci/tools/ci/firmware_package.py package --src src --build src/build-menu-sio-cinta \
                  --reports reports --out "$out" --baseline "$FW_COMMIT" --variant menu-sio-cinta
          python3 -I ci/tools/ci/firmware_package.py verify "$out"
          { echo '```'; cat "$out/reports/checks.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: out/
          if-no-files-found: error
          retention-days: 90
      - name: Record artifact digest
        shell: bash
        env:
          DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          echo "Artifact zip SHA-256: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
